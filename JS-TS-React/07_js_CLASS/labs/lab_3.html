<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/cart.css" />
    <title>select</title>
  </head>

  <body>
    <div class="container">
      <header class="header">
        <h1>Products</h1>
        <div class="cart">
          <p>
            In cart: <span id="count-in-cart" class="count-in-cart">0</span>
          </p>
          <p>Sum: <span class="sum-cart" id="sum-cart">0</span></p>
        </div>
      </header>
      <hr />
      <div id="products" class="row products">
        <!-- product start -->
        <div class="col-md-3">
          <div class="product-item">
            <h2>Title</h2>
            <p>Price</p>
            <div>
              <button class="js-btn-product btn btn-primary" data-id="1">
                Add to cart
              </button>
            </div>
          </div>
        </div>
        <!-- product end -->
      </div>

      <div id="cart-item" class="cart-item hidden">
        <div class="cart-table">
          <div>N</div>
          <div>Title</div>
          <div>Price</div>
          <div>Total</div>
          <div>Change</div>
          <div>Delete</div>
        </div>
        <div id="cart-render" class="cart-render"></div>
        <div id="cart-total" class="cart-total"></div>
      </div>
    </div>
    <!--  /.container -->

    <script type="module" src="js/lab_3.js"></script>
  </body>
</html>
