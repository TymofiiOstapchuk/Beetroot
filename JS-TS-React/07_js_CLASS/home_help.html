<!DOCTYPE html>
<html>
  <head>
    <title>home help</title>
    <meta charset="utf-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div class="container">
      <h3 class="mb-3">Home help</h3>
      <div class="row">
        <ul id="list" class="list-group col-md-4">
          <li class="list-group-item">banana</li>
          <li class="list-group-item">cherry</li>
          <li class="list-group-item">papaya</li>
          <li class="list-group-item">peach</li>
        </ul>
        <div class="col-md-4">
          <button id="add" class="btn btn-primary me-3">Append</button>
          <button id="insert" class="btn btn-warning me-3">insert</button>
          <button id="remove" class="btn btn-success">remove</button>
        </div>
      </div>
      <div class="row mt-5">
        <select name="sel" id="sel" class="col-md-4" multiple>
          <option value="1">First</option>
          <option value="2">second</option>
          <option value="3">Third</option>
          <option value="4">Fourth</option>
          <option value="5">Five</option>
        </select>
        <div class="col-md-2">
          <button id="btn-sel" class="btn btn-primary">Click me</button>
        </div>
      </div>

      <div class="row mt-5">
        <select name="sel1" id="sel1" class="col-md-4">
          <option value="1">First</option>
          <option value="2">second</option>
          <option value="3">Third</option>
          <option value="4">Fourth</option>
          <option value="5">Five</option>
        </select>
      </div>
    </div>
    <!-- /.container -->
    <script>
      const sel = document.getElementById("sel");
      sel.size = sel.options.length;

      document.addEventListener("click", handleSelect);

      function handleSelect({ target }) {
        if (target.id !== "btn-sel") {
          return;
        }
        [...sel.selectedOptions].forEach((opt) => {
          console.log(opt.value, opt.text);
          opt.parentNode.removeChild(opt);
        });
      }

      /* ========================= sel 1 */

      document.addEventListener("change", handleSel1);
      function handleSel1({ target }) {
        if (target.id !== "sel1") {
          return;
        }
        const el = target.options[target.selectedIndex];
        const value = el.value;
        console.log(value, el.text);
      }
    </script>

    <script>
      /* todo 
        - append to end of list
        - insert on 2 position 
        - remove 2-nd
      */
      const list = document.getElementById("list");

      document.addEventListener("click", handleClick);

      function handleClick({ target }) {
        switch (target.id) {
          case "add":
            add();
            return;
          case "insert":
            insert();
            return;
          case "remove":
            remove();
            return;
        }
      }

      function createElement(text) {
        const li = document.createElement("li");
        li.classList.add("list-group-item");
        li.textContent = text;
        return li;
      }

      function add() {
        const li = createElement("Added to end");
        list.appendChild(li);
      }

      function insert() {
        const li = createElement("before second");
        const secondEl = list.querySelectorAll("li").item(1);
        list.insertBefore(li, secondEl);
      }

      function remove() {
        const deletedEl = list.querySelectorAll("li").item(1);
        list.removeChild(deletedEl);
      }
    </script>
  </body>
</html>
