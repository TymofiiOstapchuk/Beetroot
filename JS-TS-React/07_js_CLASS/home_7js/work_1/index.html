<!DOCTYPE html>
<html>
  <head>
    <title>Work 1</title>
    <meta charset="utf-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div class="container">
      <div class="row mt-3">
        <div class="col-md-4">
          <form name="myform" autocomplete="off">
            <div class="mb-4">
              <label class="label-control">Enter text</label>
              <input type="text" name="newtext" class="form-control" />
            </div>

            <div>
              <input
                name="addBtn"
                class="btn btn-primary"
                type="button"
                value="Add"
              />
              <input
                name="remBtn"
                class="btn btn-success"
                type="button"
                value="Delete"
              />
            </div>
          </form>
        </div>
        <div class="col-md-4">
          <h3>Added elements</h3>
          <ul id="lists" class="list-group"></ul>
        </div>
      </div>
      <!-- /.row -->
    </div>
    <!-- /container -->

    <script src="js/script.js"></script>
  </body>
</html>
