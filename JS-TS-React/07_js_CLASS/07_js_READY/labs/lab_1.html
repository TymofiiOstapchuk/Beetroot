<!DOCTYPE html>
<html>
  <head>
    <title>lab_1.html</title>
    <meta charset="utf-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <style>
      .notify-box {
        position: fixed;
        top: 0;
        right: 0;
        transform: translateX(100%);
      }

      .notify-box_show {
        transform: translateX(0);
      }
    </style>
  </head>

  <body>
    <div class="container pt-3">
      <div class="row">
        <div class="col-md-3">
          <form name="myform" autocomplete="off">
            <input
              type="text"
              data-name="newtext"
              name="newtext"
              id="newtext"
              class="form-control mb-3"
            />
            <input
              type="submit"
              name="btn"
              class="btn btn-primary"
              value="Add link"
            />
          </form>
        </div>

        <ul id="items" class="col-md-5"></ul>
      </div>
      <!-- /row-->
    </div>

    <!--
1. При натисканні на кнопку додавати до елемента items посилання виду 

<li class="list-group-item d-flex">
  <a href="...." target="_blank">LINK</a>
  <button class="btn btn-primary btn-sm">Remove link</button>
</li>

2. При натисканні на кнопку Remove link видаляти відповідний
   елемент li (розглянути 2 варіанти - siblings, dataset)

-->

    <script type="module" src="js/lab_1.js"></script>
  </body>
</html>
