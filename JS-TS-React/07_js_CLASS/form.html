<!DOCTYPE html>
<html>
  <head>
    <title>Form</title>
    <meta charset="utf-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div class="container">
      <h1>Form</h1>
      <form action="#" class="col-md-4" id="my-form">
        <div class="mb-3">
          <label for="user-name" class="form-label">name</label>
          <input
            name="user-name"
            type="text"
            class="form-control"
            id="user-name"
            placeholder="enter user name"
          />
        </div>
        <div class="mb-3">
          <div class="form-check">
            <input
              name="answer"
              class="form-check-input"
              type="checkbox"
              value="yes"
              id="ch1"
              checked
            />
            <label class="form-check-label" for="ch1">Yes</label>
          </div>
          <div class="form-check">
            <input
              name="answer"
              class="form-check-input"
              type="checkbox"
              value="no"
              id="ch2"
            />
            <label class="form-check-label" for="ch2">No</label>
          </div>
        </div>
        <div class="mb-3">
          <div class="form-check">
            <input
              value="small"
              class="form-check-input"
              type="radio"
              name="size"
              id="r1"
              checked
            />
            <label class="form-check-label" for="r1">small</label>
          </div>
          <div class="form-check">
            <input
              value="medium"
              class="form-check-input"
              type="radio"
              name="size"
              id="r2"
            />
            <label class="form-check-label" for="r2">Medium</label>
          </div>
          <div class="form-check">
            <input
              value="large"
              class="form-check-input"
              type="radio"
              name="size"
              id="r3"
            />
            <label class="form-check-label" for="r3">Large</label>
          </div>
        </div>

        <select name="opts" class="form-select mb-3" aria-label="select">
          <option>Choose</option>
          <option value="1">One</option>
          <option value="2" selected>Two</option>
          <option value="3">Three</option>
        </select>
        <button class="btn btn-primary">Send</button>
      </form>
    </div>
    <!-- /.container -->

    <script>
      document.addEventListener("submit", handleSubmit);
      function handleSubmit(e) {
        e.preventDefault();
        const { target } = e;
        if (target.id !== "my-form") {
          return;
        }

        const formData = new FormData(target);
        console.log(Object.fromEntries(formData));
        console.log(formData.get("opts"));
      }
    </script>
  </body>
</html>
