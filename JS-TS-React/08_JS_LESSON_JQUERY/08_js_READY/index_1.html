<!DOCTYPE html>
<html>
  <head>
    <title>jquery</title>
    <meta charset="utf-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="_/css/style.css" />
  </head>

  <body>
    <div class="container">
      <h1 class="text-center">Hello jQuery</h1>
      <hr />
      <div class="row">
        <div class="col-md-4">
          <h1 class="title">First list</h1>
          <ul id="list1" class="list-group">
            <li class="list-group-item">First</li>
            <li class="list-group-item">Second</li>
            <li class="list-group-item">Third</li>
          </ul>
          <button class="btn btn-primary my-3">Get first list</button>
        </div>
        <div class="col-md-4">
          <h1 class="title">Second list</h1>
          <ul id="list2" class="list-group col">
            <li class="list-group-item bg-light">Fourth</li>
            <li class="list-group-item bg-light">Fifth</li>
            <li class="list-group-item bg-light">Sixth</li>
          </ul>
          <button class="btn btn-success my-3">Get second list</button>
        </div>
        <div class="col-md-4">
          <h1 class="title">Results</h1>
          <ul id="res"></ul>
        </div>
      </div>
    </div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
      integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <script>
      $(".list-group-item").css({
        border: "3px dotted red",
        color: "red",
      });
    </script>
  </body>
</html>
