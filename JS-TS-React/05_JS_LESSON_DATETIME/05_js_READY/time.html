<!DOCTYPE html>
<html>
  <head>
    <title>Date and Times</title>
    <meta charset="utf-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <h1>Date and time functions</h1>
      <h2 id="result"></h2>
    </div>
    <script>
      const result = document.getElementById("result");

      // local time
      let d = new Date("2024-10-02T12:00:00");
      console.log(d);

      // greenwith time
      d = new Date("2024-10-02T12:00:00z");
      console.log(d);

      // time in NY

      d = new Date("2024-10-02T12:00:00-04:00");
      console.log(d);

      d = new Date();
      console.log(d.getTimezoneOffset() / 60);

      /* ********************* виведення дати та часу в рядок  ******************* */

      d = new Date();
      console.log("toLocaleString() -> " + d.toLocaleString());
      console.log("toLocaleDateString() ->" + d.toLocaleDateString());
      console.log("toLocaleTimeString -> " + d.toLocaleTimeString());
      console.log("toUTCString" + d.toUTCString());

      /* ============= correct date */
      d.setFullYear(d.getFullYear() + 2);
      console.log(d);
    </script>
  </body>
</html>
