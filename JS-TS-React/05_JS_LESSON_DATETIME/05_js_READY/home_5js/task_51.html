<!doctype html>
<html>

<head>
  <title>home work 1</title>
  <meta charset="utf-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="container">
    <h2>Home work <span class="info"></span></h2>
    <ul id="results"></ul>

    <div id="d1" class="d1 green" style="opacity:1"></div>
    <input type="submit" class="btn btn-primary" id="btn-out" value="FadeOut">
    <input type="submit" class="btn btn-primary" id="btn-up" value="FadeUp">

    <script>
      const d1 = document.getElementById('d1')
      const btnOut = document.getElementById('btn-out')
      const btnUp = document.getElementById('btn-up')
      let hnd;
      const info = document.querySelector('.info')
      let flag = true;

      btnOut.onclick = () => handleFade(true)
      btnUp.onclick = () => handleFade(false)
      btnUp.setAttribute('disabled', true);


      function handleFade(flag) {
        clearInterval(hnd)
        const [b1, b2] = flag ? [btnOut, btnUp] : [btnUp, btnOut]
        b1.setAttribute('disabled', !flag);
        b2.removeAttribute('disabled')
        hnd = setInterval(() => fade(flag), 40)

      }

      function fade(flag) {
        let op = parseFloat(d1.style.opacity)
        op = flag ? op -= 0.02 : op += 0.02;
        info.textContent = op.toFixed(2)
        if (op <= 0 || op >= 1) {
          clearInterval(hnd)
        }
        d1.style.opacity = op;
      }


    </script>
</body>

</html>
