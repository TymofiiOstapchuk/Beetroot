<!DOCTYPE html>

<html>
  <head>
    <title>Conditional operators</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta charset="utf-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <style>
      .box {
        width: 90%;
        margin: auto;
        height: 100px;
        border: 2px dotted red;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 id="title">Conditional operators</h2>
      <div id="box" class="box"></div>
      <script>
        /*
          1.Отримуємо ширину блоку з id="box" та присвоюємо йому
            через властивість style background
          -якщо ширина від 0 до 300px -> yellow
          -якщо ширина від 300px до 768px -> green
          -якщо ширина від 769px до 992px -> blue
          -якщо ширина більше 992px -> red

          2. Використовуючи умову switch-case через властивість
             style визначити колір тексту в елементі з id="title"
             таким як background блоку id="box"
          */
        const box = document.getElementById("box");
        const title = document.getElementById("title");
        const boxWidth = getComputedStyle(box).width;

        let textColor = '';
        let bg = "red";
        const w = parseInt(boxWidth);
          console.log(w)

         if( w < 300 ) {
          bg = "yellow"
         }  else if (w >= 300 && w < 768) {
          bg = "green"
         } else if (w >= 768 &&  w < 992) {
          bg = "blue"
         }

         switch(bg) {
            case "yellow":
               textColor = "red";
               break;
            case "green": 
              textColor = "white";
              break;
            case "blue": 
              textColor = "white";
              break;
              
            default: 
              textColor = "white";  
              
         }


        box.textContent = boxWidth;
        box.style.backgroundColor = bg;
        box.style.color = textColor
        
      </script>
    </div>
    <!-- /.container-->
  </body>
</html>
