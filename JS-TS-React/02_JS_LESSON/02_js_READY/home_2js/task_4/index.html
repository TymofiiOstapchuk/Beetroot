<!--  prettier-ignore -->

<body>
  <div class="container">
    <h1>Today <span id="res"></span></h1>
  </div>


  <script>

    const today = new Date().getDay();
    const res = document.getElementById("res");
    /* todo  */
    let out;
    switch (today) {
      case 0: out = "Sunday"; break;
      case 1: out = "Monday"; break;
      case 2: out = "Tuesday"; break;
      case 3: out = "Wednesday"; break;
      case 4: out = "Thursday"; break;
      case 5: out = "Friday"; break;
      case 6: out = "Saturday"; break;
    }
    res.textContent = out;

    const daysOfWeek = ["Sunday", "Monday", "Tuesday", "Wednesday"]
    console.log(daysOfWeek[today])

  </script>
</body>

</html>
