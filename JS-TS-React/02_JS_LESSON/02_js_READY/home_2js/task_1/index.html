<!DOCTYPE html>

<html>

<head>
  <title>Home work</title>
  <meta charset="utf-8" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>

<body>
  <div class="container w-25">
    <h2>for</h2>
    <ul id="result_1" class="list-group">
      <li class="list-group-item">Frist</li>
    </ul>

    <h2>while</h2>
    <ul id="result_2" class="list-group"></ul>
  </div>
  <!--  /container -->

  <script>
    let out = "";

    for (let i = 1; i < 6; i++) {
      out += `<li class="list-group-item d-flex">
          <span class="me-5">${i}</span>
          <span>${i * i}</span>
          </li>`;
    }
    document.getElementById("result_1").innerHTML = out;

    out = "";
    let i = 1;
    while (i < 6) {
      out += `<li class="list-group-item d-flex">
          <span class="me-5">${i}</span>
          <span>${i * i}</span>
          </li>`;
      i++;
    }
    document.getElementById("result_2").innerHTML = out;
  </script>
</body>

</html>
