<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Slider Syncing</title>
    <link rel="stylesheet" href="css/slick.css" />
    <link rel="stylesheet" href="css/syncing.css" />
  </head>
  <body>
    <div class="container">
      <div class="slider-for">
        <div class="for-box for-box_1"></div>
        <div class="for-box for-box_2"></div>
        <div class="for-box for-box_3"></div>
        <div class="for-box for-box_4"></div>
        <div class="for-box for-box_5"></div>
        <div class="for-box for-box_6"></div>
        <div class="for-box for-box_7"></div>
        <div class="for-box for-box_8"></div>
        <div class="for-box for-box_9"></div>
        <div class="for-box for-box_10"></div>
        <div class="for-box for-box_11"></div>
      </div>

      <div class="slider-nav">
        <div class="nav-box nav-box_1"></div>
        <div class="nav-box nav-box_2"></div>
        <div class="nav-box nav-box_3"></div>
        <div class="nav-box nav-box_4"></div>
        <div class="nav-box nav-box_5"></div>
        <div class="nav-box nav-box_6"></div>
        <div class="nav-box nav-box_7"></div>
        <div class="nav-box nav-box_8"></div>
        <div class="nav-box nav-box_9"></div>
        <div class="nav-box nav-box_10"></div>
        <div class="nav-box nav-box_11"></div>
      </div>
      <div class="container container_dots"></div>
    </div>
    <!-- /.container -->

    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/slick.min.js"></script>

    <script>
      $(".slider-for").slick({
        slidesToShow: 1,
        slidesToScroll: 1,
        arrows: false,
        fade: true,
        asNavFor: ".slider-nav",
      });

      $(".slider-nav").slick({
        slidesToShow: 3,
        slidesToScroll: 1,
        arrows: true,
        asNavFor: ".slider-for",
        dots: true,
        centerMode: true,
        focusOnSelect: true,
        appendDots: ".container_dots",
        dotsClass: "dots-box",
        prevArrow: "<div class='myarrow myarrow_prev'>Prev</div>",
        nextArrow: "<div class='myarrow myarrow_next'>Next</div>",
      });
    </script>
  </body>
</html>
