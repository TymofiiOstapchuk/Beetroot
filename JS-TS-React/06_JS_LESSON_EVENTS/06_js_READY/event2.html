        <!-- 3. Написати код, який буде при натисканні на кнопці reset
          запитувати користувача, чи справді він хоче очистити форму.
Якщо буде отримано ствердну відповідь, очистити форму.
В іншому випадку залишити значення полів форми без змін
    
Написати функцію, яка буде запускатися при натисканні на кнопку "Send data",
і перевіряти чи пусте значення поля login. 
-->

        <div class="col-md-4 mb-3">
          <form
            action="index_1.html"
            id="myform"
            name="myform"
            class="form-horizontal mb-4"
            autocomplete="off"
          >
            <div class="form-group mb-4">
              <input
                type="text"
                name="login"
                placeholder="Enter here"
                class="form-control js-validate"
              />
              <span
                data-error="Field login cannot be empty"
                class="text-danger"
              ></span>
            </div>

            <div class="form-group mb-4">
              <input
                type="text"
                name="password"
                placeholder="Enter password here"
                class="form-control js-validate"
              />
              <span
                data-error="Field password cannot be empty"
                class="text-danger"
              ></span>
            </div>
            <input type="submit" class="btn btn-primary" value="Send data" />
            <input
              type="reset"
              name="reset-myform"
              class="btn btn-default"
              value="Reset"
            />
          </form>
        </div>

        <script>
          document.addEventListener("click", handleReset);
          document.addEventListener("submit", handleSubmit);
          document.addEventListener("keyup", handleKeyup);

          function handleSubmit(e) {
            const { target } = e;
            if (target.id !== "myform") {
              return;
            }

            /* ================== anthoer way to get data */
            /*      e.preventDefault();
            const formData = new FormData(target);
            console.log(formData.get("login"));
            console.log(formData.get("password"));
            console.log(Object.fromEntries(formData)); 
            */
            /* ==========================  */

            let isValid = true;

            [...target.elements].forEach((el) => {
              if (el.classList.contains("js-validate")) {
                const val = el.value.trim();
                if (!val) {
                  isValid = false;
                  const errorSpan = el.nextElementSibling;
                  errorSpan.textContent = errorSpan.dataset.error;
                }
              }
            });

            if (!isValid) {
              e.preventDefault();
            }
          }

          function handleKeyup({ target }) {
            if (!target.classList.contains("js-validate")) {
              return;
            }
            const spanErr = target.nextElementSibling;

            if (target.value.trim()) {
              spanErr.textContent = "";
              return;
            }
            spanErr.textContent = spanErr.dataset.error;
          }

          function handleReset(e) {
            const { target } = e;
            if (target.type !== "reset") {
              return;
            }
            if (!confirm("Are you sure ?")) {
              e.preventDefault();
            }
          }

          /*  const myform = document.getElementById("myform");
          myform.onsubmit = handleSubmit;

          function handleSubmit() {
            const login = this.elements.login;
            login.onkeyup = handleClean;
            if (login.value.trim().length < 3) {
              login.nextElementSibling.textContent = "Field cannot be empty";
              return false;
            }
            return true;
          }

          function handleClean() {
            if (this.value.trim().length > 3) {
              this.nextElementSibling.textContent = "";
              // this.onkeyup = null;
              return;
            } else {
              this.nextElementSibling.textContent = "Field cannot be empty";
            }
          } */
        </script>

        <!-- 4.  Завдання слухачам

  При цьому з решти всіх елементів class=bg-warning повинен
  забиратися
-->
        <div class="col-md-4 mt-3">

            <li class="list-group-item">item 1</li>
            <li class="list-group-item">item 2</li>

    <script>
      const lis = document.querySelectorAll(".list-group-item");

      lis.forEach((el) => (el.onclick = handleToggle));

      function handleToggle() {
        if (this.classList.contains("bg-warning")) {
          this.classList.remove("bg-warning");
          return;
        }
        lis.forEach((el) => {
          el === this
            ? el.classList.add("bg-warning")
            : el.classList.remove("bg-warning");
        });
      }
    </script>
