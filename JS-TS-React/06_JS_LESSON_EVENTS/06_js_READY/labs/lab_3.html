<!DOCTYPE html>
<html>
  <head>
    <title>Lab 5</title>
    <meta charset="utf-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../_/css/style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Lab 5</h2>

      <div class="navy box draggable"></div>
      <div class="green box draggable"></div>
      <div class="green box draggable"></div>
      <div class="green box draggable"></div>

      <script>
        /* Drag and drop elements c использованием событий
 mousedown, mouseup, mousemove */

        const dragOb = {
          el: null,
          dragging: false,
          zIndex: 0,
          relativeTop: 0,
          relativeLeft: 0,
          setDragOb(el, x, y) {
            this.el = el;
            this.el.style.zIndex = ++this.zIndex;
            this.relativeLeft = this.el.offsetLeft - x;
            this.relativeTop = this.el.offsetTop - y;
          },
          doDrag(x, y) {
            this.el.style.left = x + this.relativeLeft + "px";
            this.el.style.top = y + this.relativeTop + "px";
          },
        };

        function handle(e) {
          const { target, type, clientX, clientY } = e;
          let x = clientX + document.body.scrollLeft;
          let y = clientY + document.body.scrollTop;

          switch (type) {
            case "mousedown":
              if (target.classList.contains("draggable")) {
                dragOb.dragging = true;
                dragOb.setDragOb(target, x, y);
              }

              break;
            case "mouseup":
              dragOb.dragging = false;
              break;
            case "mousemove":
              if (dragOb.dragging) {
                dragOb.doDrag(x, y);
              }
              break;
          }
        }

        document.addEventListener("mousedown", handle);
        document.addEventListener("mouseup", handle);
        document.addEventListener("mousemove", handle);
      </script>
    </div>
  </body>
</html>
