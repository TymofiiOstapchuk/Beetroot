<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Smoothscroll</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="scroll-header"  data-scroll-header>
    <nav class="nav">
        <a class="nav__item" href="#home">Home</a>
        <a class="nav__item" href="#slider">Slider</a>
        <a class="nav__item" href="#about-us">About us</a>
        <a class="nav__item" href="#gallery">Gallery</a>
        <a class="nav__item" href="#testimonials">Testimonials</a>
        <a class="nav__item" href="#contacts">Contact us</a>
    </nav>
</div>
<div class="container wrap">
     <section id="home" class="section home">
         <h2>Welcome to our site</h2>
     </section>

        <section id="slider" class="section slider">
            <h2>Slider</h2>
        </section>
        <section id="about-us" class="section about-us">
            <h2>About us</h2>
        </section>

        <section id="gallery" class="section gallery">
            <h2>Gallery</h2>
        </section>

        <section id="testimonials" class="section testimonials">
            <h2>Testimonials</h2>
        </section>

        <section id="contacts" class="section contacts">
            <h2>Contacts</h2>
        </section>
</div><!-- .wrap-->


<footer class="bottom-footer">
    <nav class="nav nav_footer">
        <a class="nav__item nav__item_footer" href="#home">Home</a>
        <a class="nav__item nav__item_footer" href="#slider">Slider</a>
        <a class="nav__item nav__item_footer" href="#about-us">About us</a>
        <a class="nav__item nav__item_footer" href="#gallery">Gallery</a>
        <a class="nav__item nav__item_footer" href="#testimonials">Testimonials</a>
        <a class="nav__item nav__item_footer" href="#contacts">Contact us</a>
    </nav>
</footer>



</body>
</html>
