<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 3</title>
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <pre id="regpre" class="regpre"></pre>
    </div>

    <script>
      const regpre = document.getElementById("regpre");
      const out = (st, re) =>
        (regpre.innerHTML = st.replace(re, (st) => `<span>${st}</span>`));

      /*  ===========================================================
Регулярным выраженим в строке str убрать повторения слов
Результат вывести в консоль
    it was the thing
=================================================================  */
      st = `it was was the the thing thing`;

      const re = /(\w+)\s+(?=\1)/gi;

      out(st, re);
      console.log(st.replace(re, ""));
    </script>
  </body>
</html>
