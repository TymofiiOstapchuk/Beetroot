<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>form</title>
    <!-- prettier-ignore -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <!-- ================ todos =================  -->

    <script type="text/babel" data-type="module">
      import * as React from "/js/react.js";
      import { createRoot } from "/js/react-dom.js";

      const root = createRoot(document.getElementById("root"));

      const availableOptions = [
        "apple",
        "orange",
        "grape",
        "cherry",
        "peach",
        "pear",
      ];

      function App(props) {
        const handleTextControl = (e) => {};

        const handleMultipleChange = (e) => {};

        const handleMultiSelectChange = (e) => {};

        const handleMultiChecked = (e) => {};

        return (
          <div className="container pt-3">
            <h1 className="mb-3">Form practice</h1>
            <div className="row">
              {/* ========== start text input ======== */}
              <div className="col-md-4">
                <label className="label-control">Comma separated values</label>
                <input
                  type="text"
                  className="form-control"
                  onChange={handleTextControl}
                  value={""}
                />
              </div>
              {/* ========== end text input ======== */}

              {/* ========== start text area ======== */}
              <div className="col-md-4">
                <label className="label-control">Multi lines values</label>
                <textarea
                  rows={availableOptions.length}
                  onChange={handleMultipleChange}
                  value={""}
                  className="form-control"
                />
              </div>
              {/* ========== end text input ======== */}
              {/* ========== start multi-select ======== */}
              <div className="col-md-4">
                <label className="label-control">Multi select change</label>
                <select
                  className="form-select"
                  multiple
                  size={availableOptions.length}
                  onChange={handleMultiSelectChange}
                  value={""}
                >
                  {availableOptions.map((item) => (
                    <option key={item} value={item}>
                      {item}
                    </option>
                  ))}
                </select>
              </div>
              {/* ========== end multi-select ======== */}

              <div className="col-md-4">
                {/* =================== HOMEWORK ======== */}
                <div className="form-check">
                  <input
                    onChange={handleMultiChecked}
                    id={""}
                    value={""}
                    className="form-check-input"
                    type="checkbox"
                  />
                  <label htmlFor={""} className="form-check-label">
                    Title
                  </label>
                </div>
                {/* =============== /. HOMEWORK ======== */}
              </div>
            </div>
          </div>
        );
      }

      root.render(<App />);
    </script>
    <script type="module" src="/js/babel-standalone.js"></script>
  </body>
</html>
