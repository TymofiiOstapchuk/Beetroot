<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Styling component</title>
    <!-- prettier-ignore -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- ================ todos =================  -->
    <script type="text/babel" data-type="module">
      import * as React from "/js/react.js";
      import { createRoot } from "/js/react-dom.js";

      const root = createRoot(document.getElementById("root"));

      // ----  .box, .box__circle, .box__shape, .box__lemon
      function Box(props) {
        return (
          <div
            className="box box__circle"
            style={{ border: "3px solid tomato" }}
          >
            Box
          </div>
        );
      }

      const App = () => {
        return (
          <div className="container">
            <Box />
            <Box />
            <Box />
          </div>
        );
      };

      root.render(<App />);
    </script>

    <script type="module" src="/js/babel-standalone.js"></script>
  </body>
</html>
