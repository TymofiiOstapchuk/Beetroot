<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat room</title>
    <!-- prettier-ignore -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <!-- ================ todos =================  -->

    <script type="text/babel" data-type="module">
      import * as React from "/js/react.js";
      import { createRoot } from "/js/react-dom.js";

      const root = createRoot(document.getElementById("root"));

      function createConnection() {
        return {
          connect() {
            console.log("✅ Connecting...");
          },
          disconnect() {
            console.log("❌ Disconnected.");
          },
        };
      }

      function ChatRoom() {
        React.useEffect(() => {
          const connection = createConnection();
          connection.connect();
        }, []);
        return <h1 className="alert alert-primary">Welcome to the chat!</h1>;
      }

      function App() {
        const [show, setShow] = React.useState(false);

        return (
          <div className="container">
            <label htmlFor="show" className="me-4">
              Show chat
            </label>
            <input
              id="show"
              type="checkbox"
              checked={show}
              onChange={() => setShow((x) => !x)}
            />
            {show && <ChatRoom />}
          </div>
        );
      }

      root.render(<App />);
    </script>
    <script type="module" src="/js/babel-standalone.js"></script>
  </body>
</html>
