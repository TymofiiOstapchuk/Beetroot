<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSX, props</title>
    <!-- prettier-ignore -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <!-- ================ todos =================  -->

    <script type="text/babel" data-type="module">
      import * as React from "/js/react.js";
      import { createRoot } from "/js/react-dom.js";

      const root = createRoot(document.getElementById("root"));

      function ProfilePage({ userId }) {
        const [comment, setComment] = React.useState("");

        /*  React.useEffect(() => {
          setComment("");
        }, [userId]);
 */
        return (
          <div>
            <h1>Profile for {userId} </h1>
            <form>
              <div className="mb-3">
                <label htmlFor="comment" className="form-label">
                  Comment
                </label>
                <input
                  value={comment}
                  onChange={(e) => setComment(e.target.value)}
                  type="text"
                  className="form-control"
                  id="comment"
                  name="comment"
                />
              </div>
              <div>
                <button className="btn btn-primary">Send comment</button>
              </div>
            </form>
          </div>
        );
      }

      function App() {
        const [userId, setUserId] = React.useState(1);

        function nextUser() {
          setUserId((id) => (id === 1 ? 2 : 1));
        }

        return (
          <div className="container">
            <button onClick={nextUser} className="btn btn-success">
              Change user
            </button>
            <ProfilePage userId={userId} />
          </div>
        );
      }

      root.render(<App />);
    </script>
    <script type="module" src="/js/babel-standalone.js"></script>
  </body>
</html>
