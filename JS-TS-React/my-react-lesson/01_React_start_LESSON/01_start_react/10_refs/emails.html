<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emails refs</title>
    <!-- prettier-ignore -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <!-- ================ todos =================  -->

    <script type="text/babel" data-type="module">
      import * as React from "/js/react.js";
      import { createRoot } from "/js/react-dom.js";

      const root = createRoot(document.getElementById("root"));

      const range = (n) => Array.from({ length: n });
      const isLast = (arr, i) => arr.length === i + 1;

      function App() {
        const [count, setCount] = React.useState(1);

        return (
          <div className="container pt-5">
            <button className="btn btn-primary">Add Recipient</button>
            <form>
              <h1>Emails</h1>
              <div className="form-group row">
                <label className="col-md-1 col-form-label">Email</label>
                <div className=" col-md-3">
                  <input className="form-control" />
                </div>
              </div>
            </form>
          </div>
        );
      }
      root.render(<App />);
    </script>
    <script type="module" src="/js/babel-standalone.js"></script>
  </body>
</html>
