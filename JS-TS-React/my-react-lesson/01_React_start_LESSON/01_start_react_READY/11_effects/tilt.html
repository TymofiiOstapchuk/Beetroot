<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tilt</title>
    <!-- prettier-ignore -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/js/tilt.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- ================ todos =================  -->

    <script type="text/babel" data-type="module">
      import * as React from "/js/react.js";
      import { createRoot } from "/js/react-dom.js";
      import VanilaTilt from "/js/vanila-tilt.js";

      const root = createRoot(document.getElementById("root"));

      function Tilt() {
        const tiltRef = React.useRef(null);

        const options = {
          scale: 1.2,
          speed: 1000,
          max: 30,
        };

        React.useEffect(() => {
          const tiltNode = tiltRef.current;
          VanilaTilt.init(tiltNode, options);
          return () => {
            console.log("destroy");
            tiltNode.vanillaTilt.destroy();
          };
        }, []);

        return (
          <div ref={tiltRef} className="tilt-root">
            Tilt
          </div>
        );
      }

      function App() {
        const [show, setShow] = React.useState(false);

        return (
          <div className="container">
            <label htmlFor="show-tilt">
              <input
                id="show-tilt"
                type="checkbox"
                checked={show}
                onChange={() => setShow(!show)}
              />
              <span>{show ? "Hide tilt" : "Show tilt"}</span>
            </label>

            {show && <Tilt />}
          </div>
        );
      }

      root.render(<App />);
    </script>

    <script type="module" src="/js/babel-standalone.js"></script>
  </body>
</html>
