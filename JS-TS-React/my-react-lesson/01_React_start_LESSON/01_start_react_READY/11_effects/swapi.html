<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swapi</title>
    <!-- prettier-ignore -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <!-- ================ todos =================  -->

    <script type="text/babel" data-type="module">
      import * as React from "/js/react.js";
      import { createRoot } from "/js/react-dom.js";

      const root = createRoot(document.getElementById("root"));

      function client(url) {
        return fetch(url).then((r) => {
          if (!r.ok) {
            throw new Error(r.statusText);
          }
          return r.json();
        });
      }

      async function wait(ms) {
        return new Promise((resolve) => {
          setTimeout(resolve, ms);
        });
      }

      const InputFilter = ({ filter, handleFilter }) => (
        <input
          value={filter}
          onChange={(e) => handleFilter(e.target.value)}
          className="form-control"
        />
      );

      function filterItems(items, filter) {
        if (filter) {
          return items.filter((v) =>
            v.name.toLowerCase().includes(filter.toLowerCase())
          );
        }
        return items;
      }

      function App() {
        const [results, setResults] = React.useState([]);
        const [filter, setFilter] = React.useState("");
        const [loader, setLoader] = React.useState(false);
        const [error, setError] = React.useState(null);

        React.useEffect(() => {
          async function getPeople() {
            try {
              setError(null);
              setLoader(true);
              const { results } = await client("http://swapi.dev/api/people");
              setResults(results);
            } catch (err) {
              setError(err);
              console.log(err.message);
            } finally {
              setLoader(false);
            }
          }
          getPeople();
        }, []);

        const renderItems = filterItems(results, filter);

        return (
          <div className="container">
            <>
              {error && <h1>Error !!!</h1>}
              {loader && (
                <div
                  className="spinner-border text-primary"
                  role="status"
                ></div>
              )}
              <div className="my-5 w-25">
                <InputFilter filter={filter} handleFilter={setFilter} />
              </div>
              <ul className="list-group w-1/3">
                {renderItems?.map((item) => (
                  <SwapiItem key={item.name} name={item.name} />
                ))}
              </ul>
            </>
          </div>
        );
      }

      function SwapiItem({ name }) {
        return <li className="list-group-item">{name}</li>;
      }

      root.render(<App />);
    </script>
    <script type="module" src="/js/babel-standalone.js"></script>
  </body>
</html>
