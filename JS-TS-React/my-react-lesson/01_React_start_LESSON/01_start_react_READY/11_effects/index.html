<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Side effects</title>
    <!-- prettier-ignore -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <!-- ================ todos =================  -->

    <script type="text/babel" data-type="module">
      import * as React from "/js/react.js";
      import { createRoot } from "/js/react-dom.js";

      const root = createRoot(document.getElementById("root"));

      function VideoPlayer({ src, isPlaying }) {
        const ref = React.useRef(null);

        React.useEffect(() => {
          if (isPlaying) {
            ref.current.play();
            console.log("Calling video.play()");
          } else {
            ref.current.pause();
            console.log("Calling video.pause()");
          }
        }, [isPlaying]);

        return (
          <div className="row pt-4">
            <div className="col-md-5">
              <video ref={ref} src={src} loop playsInline />
            </div>
          </div>
        );
      }

      function App() {
        const [isPlaying, setIsPlaying] = React.useState(false);
        const [text, setText] = React.useState("");

        return (
          <div className="container">
            <input value={text} onChange={(e) => setText(e.target.value)} />

            <button onClick={() => setIsPlaying(!isPlaying)}>
              {isPlaying ? "Pause" : "Play"}
            </button>
            <VideoPlayer
              isPlaying={isPlaying}
              src="https://mdn.github.io/learning-area/html/multimedia-and-embedding/video-and-audio-content/rabbit320.webm"
            />
          </div>
        );
      }

      root.render(<App />);
    </script>
    <script type="module" src="/js/babel-standalone.js"></script>
  </body>
</html>
