<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Props validate</title>
    <!-- prettier-ignore -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <!-- ================ todos =================  -->

    <script type="text/babel" data-type="module">
      import * as React from "/js/react.js";
      import { createRoot } from "/js/react-dom.js";
      import { PropTypes } from "/js/prop-types.js";

      const root = createRoot(document.getElementById("root"));

      function App(props) {
        return (
          <div className="container">
            <h1>
              Hello {props.firstName} {props.lastName}
            </h1>
          </div>
        );
      }

      App.propTypes = {
        firstName: PropTypes.string.isRequired,
        lastName: PropTypes.string.isRequired,
      };

      App.defaultProps = {
        firstName: "Bill",
        lastName: "Geits",
      };

      root.render(<App firstName="Pete" />);
    </script>
    <script type="module" src="/js/babel-standalone.js"></script>
  </body>
</html>
