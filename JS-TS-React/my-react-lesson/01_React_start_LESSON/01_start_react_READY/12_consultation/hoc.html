<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Components</title>
    <!-- prettier-ignore -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <!-- ========= HOC => render properties => hooks ==============  -->

    <script type="text/babel" data-type="module">
      import * as React from "/js/react.js";
      import { createRoot } from "/js/react-dom.js";

      const root = createRoot(document.getElementById("root"));

      const users = ["Bill", "Tom"];

      const List = () => (
        <ul>
          {users.map((user, i) => (
            <li key={i}>{user}</li>
          ))}
        </ul>
      );

      const Message = () => <p>this is paragraph</p>;

      const withTitle = (BaseComponent) => (props) =>
        (
          <>
            <h1>{props.title}</h1>
            <BaseComponent {...props} />
          </>
        );

      const TitledList = withTitle(List);
      const TitledMessage = withTitle(Message);

      function App() {
        return (
          <div className="container">
            <TitledList title="My awesome users" />
            <List />
            <Message />
            <TitledMessage title="My Message" />
          </div>
        );
      }

      root.render(<App />);
    </script>
    <script type="module" src="/js/babel-standalone.js"></script>
  </body>
</html>
