<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <!-- prettier-ignore -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <!-- ================ todos =================  -->

    <script type="text/babel" data-type="module">
      import * as React from "/js/react.js";
      import { createRoot } from "/js/react-dom.js";

      const root = createRoot(document.getElementById("root"));

      function App(props) {
        const [showPassword, setShowPassword] = React.useState(false);

        return (
          <div className="container pt-3">
            <h1 className="mb-3">Users form</h1>

            <form className="col-md-4">
              <div className="form-group mb-3">
                <label htmlFor="password">Password</label>
                <input
                  type={showPassword ? "text" : "password"}
                  id="password"
                  className="form-control"
                />
              </div>

              <div className="form-check">
                <input
                  checked={showPassword}
                  onChange={() => setShowPassword(!showPassword)}
                  className="form-check-input"
                  type="checkbox"
                  id="passwordCheck"
                />
                <label className="form-check-label" htmlFor="passwordCheck">
                  Show password
                </label>
              </div>

              <button className="btn btn-primary mt-3">Send</button>
            </form>
          </div>
        );
      }
      root.render(<App />);
    </script>
    <script type="module" src="/js/babel-standalone.js"></script>
  </body>
</html>
