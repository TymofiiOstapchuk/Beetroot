<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>State preserve</title>
    <!-- prettier-ignore -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <!-- ================ todos =================  -->

    <script type="text/babel" data-type="module">
      import * as React from "/js/react.js";
      import { createRoot } from "/js/react-dom.js";

      const root = createRoot(document.getElementById("root"));

      function Counter({ isFancy }) {
        const [count, setCount] = React.useState(0);
        const [hover, setHover] = React.useState(false);
        const id = React.useId();

        function handleClick() {
          setCount(count + 1);
        }

        let cls = "p-3 border d-inline-block border-danger m-3";

        if (hover) {
          cls += "  bg-warning";
        }
        if (isFancy) {
          cls += " border-5";
        }

        return (
          <div
            onPointerEnter={() => setHover(true)}
            onPointerLeave={() => setHover(false)}
            className={cls}
          >
            <span className="h3 d-block text-center">{count}</span>
            <button id={id} onClick={handleClick} className="btn btn-primary">
              Increment
            </button>
          </div>
        );
      }

      function App(props) {
        const [show, setShow] = React.useState(false);

        return (
          <div className="container">
            <Counter />
            {show && <Counter />}

            <div className="form-check">
              <input
                onChange={() => setShow(!show)}
                checked={show}
                className="form-check-input"
                type="checkbox"
                id="toggleCounter"
              />
              <label className="form-check-label" htmlFor="toggleCounter">
                Show Couner 2
              </label>
            </div>
          </div>
        );
      }

      {
        /*
            function App(props) {
              const [isFancy, setIsFancy] = React.useState(false);

              return (
                <div className="container">
                  <Counter isFancy={isFancy} />
                  <Counter />

                  <div className="form-check">
                    <input
                      onChange={() => setIsFancy(!isFancy)}
                      checked={isFancy}
                      className="form-check-input"
                      id="ch"
                      type="checkbox"
                    />
                    <label htmlFor="ch">toggle isFancy</label>
                  </div>
                </div>
              );
            }
              */
      }
      root.render(<App />);
    </script>
    <script type="module" src="/js/babel-standalone.js"></script>
  </body>
</html>
