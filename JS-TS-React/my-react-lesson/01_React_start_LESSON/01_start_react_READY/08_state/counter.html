<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter</title>
    <!-- prettier-ignore -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <!-- ================ todos =================  -->

    <script type="text/babel" data-type="module">
      import * as React from "/js/react.js";
      import { createRoot } from "/js/react-dom.js";

      const root = createRoot(document.getElementById("root"));

      function App(props) {
        const [count, setCount] = useState(0);
        const [error, setError] = useState(null);

        console.log(state);

        //#region
        function increment() {
          setCount((count) => count + 1);
          setError(null);
        }
        function decrement() {
          if (count > 1) {
            setCount(count - 1);
          } else {
            setError("cannot be less 1 😠");
          }
        }
        function reset() {
          setCount(0);
          setError(null);
        }

        return (
          <div className="container pt-3">
            <h1 className="mb-3">Counter {count}</h1>
            <button onClick={increment} className="btn btn-primary me-3">
              Increment
            </button>
            <button onClick={decrement} className="btn btn-success  me-3">
              Decrement
            </button>
            <button onClick={reset} className="btn btn-danger">
              Reset
            </button>

            {error && (
              <marquee direction="right" className="mt-3">
                <p onClick={() => setError(null)}>{error}</p>
              </marquee>
            )}
          </div>
        );
        //#endregion
      }

      const state = [];
      let callCount = -1;

      function useState(initValue) {
        const id = ++callCount;
        if (state[id]) {
          return state[id];
        }

        const setState = (v) => {
          const newVal = typeof v === "function" ? v(state[id][0]) : v;
          state[id][0] = newVal;
          renderHook();
        };

        const tuple = [initValue, setState];
        state.push(tuple);
        return tuple;
      }

      function renderHook() {
        callCount = -1;
        root.render(<App />);
      }
      renderHook();
    </script>
    <script type="module" src="/js/babel-standalone.js"></script>
  </body>
</html>
