      function Button() {
        return (
          <div onClick={() => alert("Div clicked")} className="p-5 bg-success">
            <button
              onClick={(e) => {
                e.stopPropagation();
                alert("Button Clicked");
              }}
              className="btn btn-primary"
            >
              Click me
            </button>
          </div>
        );
      }

      function App(props) {
        return (
          <div className="container my-3">
            <Button />
          </div>
