<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>State preserve</title>
    <!-- prettier-ignore -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <!-- ================ todos =================  -->

    <script type="text/babel" data-type="module">
      import * as React from "/js/react.js";
      import { createRoot } from "/js/react-dom.js";

      const root = createRoot(document.getElementById("root"));

      function Counter({ title }) {
        const [count, setCount] = React.useState(0);

        function handleClick() {
          setCount(count + 1);
        }

        let cls = "p-3 border border-2 d-inline-block border-danger m-3";

        return (
          <div className={cls}>
            <span className="h3 d-block text-center mb-3">{title}</span>
            <p className="h4 mb-3">Count: {count}</p>
            <button onClick={handleClick} className="btn btn-primary">
              Increment
            </button>
          </div>
        );
      }
      function App(props) {
        const [isFirstCounter, setIsFirstCounter] = React.useState(false);

        return (
          <div className="container">
            {isFirstCounter && <Counter title="First Counter" />}
            {!isFirstCounter && <Counter title="Second Counter" />}

            {/*  
            {!isFirstCounter ? (
              <Counter key="first" title="First" />
            ) : (
              <Counter key="second" title="Second" />
            )}
              */}

            <div className="form-check mt-5">
              <input
                checked={isFirstCounter}
                onChange={() => setIsFirstCounter(!isFirstCounter)}
                className="form-check-input"
                type="checkbox"
                id="toggleCounter"
              />
              <label className="form-check-label" htmlFor="toggleCounter">
                {isFirstCounter ? "Show Second Counter" : "Show First Counter"}
              </label>
            </div>
          </div>
        );
      }
      root.render(<App />);
    </script>
    <script type="module" src="/js/babel-standalone.js"></script>
  </body>
</html>
