<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Key prop in map</title>
    <!-- prettier-ignore -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <!-- ================ todos =================  -->

    <script type="text/babel" data-type="module">
      import * as React from "/js/react.js";
      import { createRoot } from "/js/react-dom.js";

      const root = createRoot(document.getElementById("root"));

      const allItems = [
        { id: "a", value: "apple" },
        { id: "c", value: "cherry" },
        { id: "p", value: "peach" },
        { id: "t", value: "tomato" },
      ];

      function App() {
        const [items, setItems] = React.useState([]);

        const addItem = () =>
          setItems((items) => [
            ...items,
            allItems.find((v) => !items.includes(v)),
          ]);

        const removeItem = (id) =>
          setItems((items) => items.filter((item) => item.id !== id));

        return (
          <div className="container">
            <h1>Key props</h1>

            <button
              disabled={items.length === allItems.length}
              onClick={addItem}
              className="btn btn-primary"
            >
              Add +
            </button>
            {items.map((item, i) => (
              <div className="my-3" key={item.id}>
                <button onClick={() => removeItem(item.id)}> - </button>
                <span className="mx-3">{item.value}</span>
                <input />
              </div>
            ))}
          </div>
        );
      }

      root.render(<App />);
    </script>
    <script type="module" src="/js/babel-standalone.js"></script>
  </body>
</html>
