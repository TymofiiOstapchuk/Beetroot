<!DOCTYPE html>
<html>
  <head>
    <title>Array iterators</title>
    <meta charset="utf-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <h1>Array Iterators</h1>
      <ul id="results" class="list-group"></ul>
    </div>
    <script>
      /* ---------------  NO DELETE */
      const results = document.getElementById("results");
      const numbers = [1, 2, 3, 4, 5, 4, 3, 2, 1];
      const persons = [
        { id: 1, name: "Tom", age: 20 },
        { id: 2, name: "Bill", age: 80 },
        { id: 3, name: "Ashley", age: 30 },
        { id: 4, name: "Ainura", age: 20 },
        { id: 5, name: "Greg", age: 30 },
      ];
      let arr;
      /*   NO DELETE ---------------/  */

      /* ======================== forEach ==========================  */
      /*   let sum = 0;
      numbers.forEach(function (item) {
        sum += item;
      });
      console.log(sum);
     */
      /* ======================== filter ==========================  */
      /* const newPersons = persons.filter((v) => v.age === 30);
      console.log(newPersons);
 */
      /* ======================== map ==========================  */
      results.innerHTML = persons
        .map((user) => `<li class="list-group-item">${user.name}</li>`)
        .join("");

      /* ======================== findIndex ==========================  */
      const index = numbers.findIndex((item) => item === 4);
      console.log(index);

      const indexPerson = persons.findIndex((u) => u.name === "Ashley");
      console.log(indexPerson);
      console.log(persons[indexPerson].name);
      /* ======================== find ==========================  */

      const user = persons.find((u) => u.name === "Bill");
      console.log(user.name);
    </script>
  </body>
</html>
