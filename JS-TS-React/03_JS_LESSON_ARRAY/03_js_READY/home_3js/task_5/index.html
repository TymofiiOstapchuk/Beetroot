<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />
</head>

<body>
  <div class="container">
    <div class="row">
      <div class="col-sm-3 mt-3">
        <select id="users-select" class="form-select">
          <option>Choose age</option>
        </select>
      </div>
      <div class="col-sm-4 offset-md-1">
        <h2>Users</h2>
        <ul id="result" class="list-group"></ul>
      </div>

    </div>
  </div>
  <script>
    /*
В елемент select вивести сгрупований вік користувачів

Тобто у нас є 9 users та їх вік відповідно  20, 30, 40
На підставі масиву users треба сформувати наступний код 

  <option value="-1">Choose age</option>
  <option value="20">20</option>
  <option value="30">30</option>
  <option value="40">40</option>

та вивести його в елемент select з id="users-select" 

Зверніть увагу - вік має бути сортирований від меньшого до більшого  
*/

    const usersSelect = document.getElementById("users-select");
    const result = document.getElementById('result')
    const cats = [
      { id: 1, title: "Panasonic" },
      { id: 2, title: "Sony" },
    ]

    let users = [
      { id: 1, name: "John", age: "20" },
      { id: 2, name: "Sasha", age: "30" },
      { id: 3, name: "Bill", age: "40" },
      { id: 4, name: "Ashley", age: "20" },
      { id: 5, name: "Rachel", age: "40" },
      { id: 6, name: "Tom", age: "30" },
      { id: 7, name: "Steve", age: "30" },
      { id: 8, name: "Jim", age: "40" },
      { id: 9, name: "Willy", age: "20" },
      { id: 10, name: "Willy", age: "60" },
    ];

    /*  todo  */
    const ages = users.reduce((acc, item) => {
      let age = Number(item.age)
      !acc.includes(age) && acc.push(age)
      return acc;
    }, []);

    const ages1 = [...new Set(users.map(el => el.age))]


    usersSelect.innerHTML = '<option value="-1">Choose</option>'
      + ages.sort((a, b) => a - b)
        .map(el => `<option value="${el}">${el}</option>`)
        .join('')


    usersSelect.addEventListener('change', handleChange)

    function showItems(items, result) {
      result.innerHTML = items.map(item => `<li class="list-group-item">${item.name} has ${item.age}</li>`)
    }

    function handleChange(e) {
      const val = e.target.value;
      const selectedUsers = users.filter(u => u.age === val)
      showItems(selectedUsers, result)
    }


  </script>
</body>

</html>
