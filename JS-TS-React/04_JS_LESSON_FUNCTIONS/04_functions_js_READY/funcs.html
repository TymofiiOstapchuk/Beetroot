<!DOCTYPE html>
<html>
  <head>
    <title>Functions</title>
    <meta charset="utf-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <h2 class="h3">Functions</h2>
      <div id="result" class="h4"></div>
    </div>
    <!-- /.container -->
    <script>
      "use strict";
      function sayHi(a, b, c) {
        console.log(`Hi ${this.firstName}, sum: ${a + b + c}`);
      }

      const u1 = {
        firstName: "Bill",
      };

      const u2 = {
        firstName: "Tom",
      };

      // sayHi.call(u1);
      // sayHi.apply(u2);

      const fn1 = sayHi.bind(u1, 10);

      fn1(20, 30);
      fn1(120, 130);

      /* ===================  */
      function fn() {
        //this, name, arguments,
        const args = [].slice.call(arguments);
        const args1 = [...arguments];

        console.log(args.forEach);
        console.log(args1.forEach);
      }

      function fn1(...args) {
        console.log(args.forEach);
      }

      fn(1, 2, 3, 4, 5);
      fn1(1, 2, 3, 4, 5);

      const person = {
        name: "Bill",
      };

      function setName(ob) {
        // ob = {};
        ob.name = "Paul";
      }
      console.log(person.name);
      setName(person);
      console.log(person.name);

      /* ================================  */

      const arr = [1, 2, 3];
      const arr1 = arr;

      arr1[0] = 400;
      console.log(arr);
      console.log(arr1);

      /* ================================  */

      const arr2 = [1, 2, 3];
      const arr3 = [...arr2];

      arr3[0] = 400;
      console.log(arr2);
      console.log(arr3);
    </script>
  </body>
</html>
