<!DOCTYPE html>
<html>
  <head>
    <title>Example JS</title>
    <meta charset="utf-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <h2 class="h3">Example closures</h2>
      <div id="result" class="h4"></div>
      <button id="btn">Click me</button>
    </div>
    <!-- /.container -->
    <script>
      function sum(a) {
        return function (b) {
          return a + b;
        };
      }
      const s = sum(10);
      console.log(s(20));
      console.log(s(50));
    </script>
  </body>
</html>
