<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>type number</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <p class="display-6">
        <code>Number(var)</code> => аналог <code> +var</code>
      </p>
    </div>

    <script>
     /*  let st = "Hello";
      const n1 = 23;
      const n2 = 22.2;
      const n3 = 0xff;
      const n4 = 3e-4; // 3 * 10^-4

      console.log(`n1 = ${n1}, type: ${typeof n1}`);
      console.log(`n2 = ${n2}, type: ${typeof n2}`);
      console.log(`n3 = ${n3}, type: ${typeof n3}`);
      console.log(`n4 = ${n4}, type: ${typeof n4}`);
 */
      /* ===================== Number() ========  */
      const f = false;
      const t = true;
      const und = undefined;
      const nil = null;

      /*
      console.log("==== Casting with Number() === ");
     
      console.log(`Number(false) => `, Number(f));
      console.log(`Number(true) => `, Number(t));
      console.log(`Number(undefined) => `, Number(und));
      console.log(`Number(null) => `, Number(nil)); 
*/
      const st1 = "12px";
      const st2 = "";
      const st3 = " ";
      const st4 = "Hello";
      const st5 = "0xff";

      /*    
    
      console.log("==== Casting  string to number with  Number() === ");
     
       console.log(`Number("12px") => `, Number(st1));
      console.log(`Number("") => `, Number(st2));
      console.log(`Number(" ") => `, Number(st3));
      console.log(`Number("Hello") => `, Number(st4));
      console.log(`Number("0xff") => `, Number(st5)); 
  */
      const st6 = "12px";
      const st7 = "12.33px";

      /* 
      console.log("==== Casting string with  Number(), parseInt(), parseFloat() === ");
      console.log(`Number("12px") => ${Number(st6)}, `);
      console.log(`parseInt("12px") =>${parseInt(st6)}`);
      console.log(`parseFloat("12px") => `, parseFloat(st6));
      console.log("=============================");
      console.log(`Number("12.33px") => `, Number(st7));
      console.log(`parseInt("12.33px") => `, parseInt(st7));
      console.log(`parseFloat("12.33px") => `, parseFloat(st7));
      */

      const a = "12";
      const b = +a; // Number(a)
      console.log(a, typeof a) // a is not mutable 
      console.log(b, typeof b) 
    </script>
  </body>
</html>
