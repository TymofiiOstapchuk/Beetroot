<!DOCTYPE html>
<html>
  <head>
    <title>Годиник на java script</title>
    <meta charset="utf-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <h2>Watch</h2>
      <hr />
      <div id="clock">
        <p id="day-week" class="h1">Monday</p>
        <p id="date" class="h1">dd.mm.YY : HH.mm.ss</p>
      </div>
    </div>

    <script>
      const daysOfWeek = [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday",
        "Sunday",
      ];

      const dw = document.getElementById("day-week");
      const date = document.getElementById("date");

      const nDate = (v) => (v < 10 ? "0" + v : v);
      const nMonth = (v) => v + 1;
      const nDat = (v) => (v === 0 ? 6 : v - 1);

      function showDate() {
        const d = new Date();
        let stDate = `${nDate(d.getDate())}.${nDate(
          nMonth(d.getMonth())
        )}.${d.getFullYear()}`;

        stDate += ` ${nDate(d.getHours())}:${nDate(d.getMinutes())}:${nDate(
          d.getSeconds()
        )}`;

        date.innerHTML = stDate;

        const dayWeek = d.getDay();
        dw.innerHTML = daysOfWeek[nDat(dayWeek)];

        setTimeout(showDate, 1000);
      }

      showDate();
    </script>
  </body>
</html>
