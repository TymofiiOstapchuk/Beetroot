<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Responsive slick slider</title>
    <link rel="stylesheet" href="css/slick.css" />
    <style>
      .container {
        max-width: 1200px;
        margin: auto;
      }
      img {
        max-width: 100%;
        width: 100%;
      }
      .slider {
        border: 1px solid red;
      }

      @media (min-width: 1000px) {
        .slider {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 15px;
        }
        .slider img {
          height: 220px;
          object-fit: cover;
          vertical-align: top;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="slider">
        <div><img class="im1" src="img/01.jpg" /></div>
        <div><img class="im2" src="img/02.jpg" /></div>
        <div><img class="im3" src="img/03.jpg" /></div>
        <div><img class="im4" src="img/04.jpg" /></div>
        <div><img class="im5" src="img/05.jpg" /></div>
        <div><img class="im6" src="img/06.jpg" /></div>
        <div><img class="im7" src="img/07.jpg" /></div>
        <div><img class="im8" src="img/08.jpg" /></div>
      </div>
    </div>
    <!-- /.container -->

    <script src="js/jquery-3.3.1.min.js"></script>
    <script src="js/slick.min.js"></script>

    <script>
      const settings = {
        arrows: false,
        slidesToShow: 1,
        slidesToScroll: 1,
        autoplay: true,
        dots: false,
        mobileFirst: true,
        centerMode: true,

        responsive: [
          {
            breakpoint: 500,
            settings: {
              slidesToShow: 2,
              centerMode: false,
            },
          },
          {
            breakpoint: 700,
            settings: {
              slidesToShow: 3,
            },
          },
          {
            breakpoint: 1000,
            settings: "unslick",
          },
        ],
      };
      const sl = $(".slider").slick(settings);
      $(window).on("resize", function () {
        if ($(window).width() > 600 && !sl.hasClass("slick-initialized")) {
          $(".slider").slick(settings);
        }
      });
    </script>
  </body>
</html>
